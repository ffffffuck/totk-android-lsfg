name: Android test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.3.13750724'

      - name: Install native build tools and Android packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang lld

      - name: Install Python build dependencies
        run: python -m pip install -r games/totk/requirements.txt

      - name: Prepare stable test signing key
        env:
          TOTK_SIGNING_KEY_PEM: ${{ secrets.TOTK_SIGNING_KEY_PEM }}
        run: |
          if [ -z "$TOTK_SIGNING_KEY_PEM" ]; then
            echo "Missing repository Actions secret TOTK_SIGNING_KEY_PEM. See games/totk/android/CI.md." >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$TOTK_SIGNING_KEY_PEM" > "$RUNNER_TEMP/totk-ci-key.pem"

      - name: Build Odin 3 test APK
        run: |
          python games/totk/android/ci_build_apk.py \
            --ndk "$ANDROID_SDK_ROOT/ndk/27.3.13750724" \
            --sdk "$ANDROID_SDK_ROOT" \
            --key "$RUNNER_TEMP/totk-ci-key.pem" \
            --work "$RUNNER_TEMP/totk-build" \
            --out "$RUNNER_TEMP/totk-r27-lsfg-odin3.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: totk-r27-lsfg-odin3
          path: ${{ runner.temp }}/totk-r27-lsfg-odin3.apk
          if-no-files-found: error
          retention-days: 14
